# fail2ban filter for the PFS Target & Spectrum Viewer security log.
# Install: sudo cp filter.d/pfs-viewer.conf /etc/fail2ban/filter.d/
#
# Log line example:
#   2026-11-13T15:40:00+0900 pfs-viewer client=203.0.113.5 event=not_found status=404 method=GET path=/wp-login.php
#
# Events written by the viewer:
#   bad_password        wrong dataset password
#   not_found           request to a URL the viewer does not have (typical of vulnerability scanners)
#   method_not_allowed  wrong HTTP method on a viewer URL
#   unauthorized        API access without selecting/unlocking a dataset (also happens to legitimate
#                       browsers whose session expired, so it is not counted below by default)

[Definition]

datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%S%%z

failregex = ^\s*pfs-viewer client=<HOST> event=(?:bad_password|not_found|method_not_allowed) status=\d+ 

ignoreregex =
